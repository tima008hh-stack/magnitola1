<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Магнитола</title><style>
:root{color-scheme:dark;--bg:#0c0d10;--card:#15171c;--line:#23262c;--ink:#f2f3f5;--dim:#8a8f98;--ac:#3e6ae1;--ac2:#aab9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bg{position:fixed;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at 24% 90%,#1b1e26,transparent 62%)}
body.night:after{content:"";position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);pointer-events:none;z-index:9}
#pg{position:relative;display:flex;width:200%;height:100%;touch-action:pan-y;will-change:transform}
#pg>section{flex:0 0 50%;height:100%}
.home{display:grid;grid-template-columns:46% 1fr;grid-template-rows:7vh minmax(0,1fr) 11vh;grid-gap:0 2.2vw;padding:1.5vh 2.5vw 0}
.top{grid-column:1/3;display:flex;align-items:center;font-size:2.1vh;color:var(--dim)}
.top>*{flex:1}.top .r{text-align:right;display:flex;align-items:center;justify-content:flex-end}
#hm{font-size:3.5vh;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
#hm em{font-style:normal;animation:bl 2s steps(1) infinite}
@keyframes bl{50%{opacity:.25}}
#nm{width:5vh;height:5vh;margin-left:1.2vw;border-radius:50%;color:var(--dim);display:flex;align-items:center;justify-content:center}
#nm svg{width:2.6vh;height:2.6vh}
.carp{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
#sp{font-size:15vh;line-height:1;letter-spacing:-.04em}
.spd small{font-size:2.2vh;color:var(--dim);margin-left:.6vw}
.carw{position:relative;width:100%;margin-bottom:5vh}
#car{display:block;width:100%;-webkit-box-reflect:below 0 linear-gradient(transparent 60%,rgba(255,255,255,.16));filter:drop-shadow(0 2vh 3vh rgba(0,0,0,.6))}
#glow{position:absolute;left:8%;right:8%;bottom:-2%;height:12%;background:radial-gradient(closest-side,var(--ac),transparent);filter:blur(14px);opacity:.35}
#road{position:absolute;left:-6%;right:-6%;bottom:-.6vh;height:.35vh;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 4vh,transparent 4vh 9vh);background-size:9vh .4vh;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.right{display:flex;flex-direction:column;min-height:0}
.nav{flex:1;position:relative;overflow:hidden;border-radius:2vh;margin-bottom:1.6vh;padding:3vh 2vw;text-align:left;min-height:0;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/5vh 5vh,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/5vh 5vh,#12151a}
.nav b{position:relative;display:block;font-size:3.6vh}.nav small{position:relative;color:var(--dim);font-size:2vh}
.nav svg{position:absolute;left:0;top:0;width:100%;height:100%;stroke:var(--ac);stroke-width:3}
.mus{display:grid;grid-template-columns:18vh 1fr;grid-gap:0 2vh;padding:2vh;border-radius:2vh;background:var(--card)}
#cov{width:18vh;height:18vh;border-radius:1.4vh;background:#222 center/cover;display:flex;align-items:center;justify-content:center;font-size:8vh;color:rgba(255,255,255,.5)}
#cov:after{content:"♪"}#cov.pic:after{content:none}
.mi{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#ti{display:block;font-size:2.8vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ar{display:block;font-size:2vh;color:var(--dim);margin-top:.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wave{width:100%;height:5.5vh}
.ctl{display:flex;align-items:center}
.ctl .b{margin-right:1.2vw}
.b{width:7.4vh;height:7.4vh;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.b svg{width:46%;height:46%;fill:currentColor;stroke:none}
.b:active{transform:scale(.9)}
.b.s{width:5.4vh;height:5.4vh;color:var(--dim)}
.b.big{background:#f2f3f5;color:#0c0d10}
#bar{grid-column:1/3;position:relative;height:3vh;margin-top:1.4vh}
#bar b{position:absolute;left:0;right:0;top:50%;height:.7vh;margin-top:-.35vh;border-radius:1vh;background:rgba(255,255,255,.12);overflow:hidden}
#fill{display:block;height:100%;width:0;background:#f2f3f5}
#tt{grid-column:1/3;text-align:right;font-size:1.6vh;color:var(--dim)}
.dock{grid-column:1/3;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line)}
.d{width:9vh;height:9vh;margin:0 2.2vw;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d6d9de}
.d svg{width:4.2vh;height:4.2vh}.d:active{background:#22252c}
.apps{padding:4vh 4vw 4vh;overflow-y:auto}
.apps h2{font-size:3.4vh;margin-bottom:3vh;display:flex;align-items:center}
#home{font-size:2.2vh;color:var(--dim);margin-right:2vw;padding:1vh 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17vh,1fr));grid-gap:2vh}
.t{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 0;border-radius:2vh;background:var(--card);font-size:2vh;min-width:0}
.t i{display:block;font-style:normal;width:9vh;height:9vh;line-height:9vh;font-size:5vh;border-radius:2.4vh;margin-bottom:.9vh;background:linear-gradient(145deg,hsl(var(--h),60%,45%),hsl(var(--h),60%,28%))}
#toast{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);padding:1.4vh 2.4vh;border-radius:3vh;background:#23262c;font-size:2vh;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10}
</style></head><body><div id="bg"></div><div id="pg">
